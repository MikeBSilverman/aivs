# CI for AIVS.
#
# Source lives in Azure DevOps. This pipeline runs the same checks a developer
# runs locally, against a real PostgreSQL service container, and fails the build
# on any of them.
#
# The ordering is deliberate: the fast, cheap checks (format, lint, types) run
# before the database is needed, so a formatting mistake fails in under a minute
# rather than after the full suite. Security checks run unconditionally rather
# than as a nightly job -- a dependency advisory that lands on a Tuesday should
# break Tuesday's build, not be discovered in a monthly report.
#
# One-time setup: none. There are no pipeline variables or service connections
# to configure, because nothing here talks to anything outside the agent.

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  # Pinned rather than floating. The container images the members deploy are
  # built on 3.12, and CI must not pass on a version production does not run.
  PYTHON_VERSION: "3.12"
  # Points the test suite at the service container below.
  AIVS_TEST_DATABASE_URL: "postgresql+psycopg://aivs:aivs@localhost:5432/aivs_test"
  AIVS_MIGRATION_DATABASE_URL: "postgresql+psycopg://aivs:aivs@localhost:5432/aivs_dev"
  UV_CACHE_DIR: $(Pipeline.Workspace)/.uv-cache

stages:
  - stage: Verify
    displayName: Verify
    jobs:
      - job: checks
        displayName: Lint, types, security, tests
        timeoutInMinutes: 20

        services:
          postgres: postgres

        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(PYTHON_VERSION)
            displayName: Use Python $(PYTHON_VERSION)

          - task: Cache@2
            inputs:
              key: 'uv | "$(Agent.OS)" | uv.lock'
              restoreKeys: |
                uv | "$(Agent.OS)"
              path: $(UV_CACHE_DIR)
            displayName: Cache uv downloads

          - script: |
              set -euo pipefail
              # Pinned to the same uv the Dockerfile uses (UV_IMAGE in
              # packages/aivs-server/Dockerfile). Bump both together, so the
              # toolchain that builds the release image cannot drift from the
              # one CI validated against.
              curl -LsSf https://astral.sh/uv/0.11.16/install.sh | sh
              echo "##vso[task.prependpath]$HOME/.local/bin"
            displayName: Install uv

          - script: |
              set -euo pipefail
              # --frozen: install exactly what uv.lock pins. A lockfile that has
              # drifted from pyproject.toml fails here rather than silently
              # resolving to something nobody reviewed.
              uv sync --frozen --python "$(PYTHON_VERSION)"
            displayName: Install dependencies (locked)

          # -- Fast checks first ------------------------------------------
          - script: uv run ruff format --check .
            displayName: Format

          - script: uv run ruff check --output-format=github .
            displayName: Lint

          - script: |
              set -euo pipefail
              uv run mypy \
                packages/aivs-schemas/src \
                packages/aivs-server/src \
                packages/aivs-client/src
            displayName: Types (strict)

          # -- Security ---------------------------------------------------
          - script: uv run bandit -c pyproject.toml -r packages/aivs-server/src packages/aivs-schemas/src packages/aivs-client/src
            displayName: Static security analysis

          - script: |
              set -euo pipefail
              # Audited from the lockfile, not from the installed environment.
              #
              # `--skip-editable --strict` was self-contradictory here: uv
              # installs the three workspace members as editable, --strict
              # treats every skipped distribution as a failure, and so the gate
              # could only ever fail. Exporting with --no-emit-workspace drops
              # our own packages -- which have no published advisories to check
              # anyway -- and leaves every third-party pin, so --strict now
              # means what it says: nothing went unaudited.
              #
              # Same source of truth as the SBOM, so the set of dependencies
              # this gate cleared is exactly the set the SBOM describes.
              uv export --no-emit-workspace --format requirements-txt -o /tmp/audit.txt
              uv run pip-audit --strict --requirement /tmp/audit.txt
            displayName: Dependency advisories

          - script: |
              set -euo pipefail
              for script in deploy/ca/*.sh; do
                bash -n "$script"
              done
              # No `if command -v`: a missing shellcheck must fail the build
              # rather than silently stop linting the scripts that mint key
              # material. bash -n alone catches syntax, not an unquoted
              # expansion or a swallowed exit status.
              command -v shellcheck >/dev/null \
                || sudo apt-get install -y --no-install-recommends shellcheck
              shellcheck -S warning deploy/ca/*.sh
            displayName: Shell script checks

          # -- Database-backed --------------------------------------------
          - script: |
              set -euo pipefail
              until pg_isready -h localhost -p 5432 -U aivs; do sleep 1; done
              PGPASSWORD=aivs psql -h localhost -U aivs -d postgres \
                -c "CREATE DATABASE aivs_test;" -c "CREATE DATABASE aivs_dev;"
            displayName: Prepare databases

          - script: |
              set -euo pipefail
              # Migrations must apply cleanly from empty, and must leave no
              # difference against the models. A schema that only exists because
              # someone ran create_all locally would fail here.
              uv run alembic -c packages/aivs-server/alembic.ini upgrade head
              uv run alembic -c packages/aivs-server/alembic.ini check
            displayName: Migrations apply with no drift

          - script: |
              set -euo pipefail
              uv run pytest \
                --junitxml=junit.xml \
                --cov=aivs_server --cov=aivs_schemas --cov=aivs_client \
                --cov-report=xml --cov-report=term-missing \
                -q
            displayName: Tests

          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: junit.xml
              testRunTitle: AIVS $(Build.BuildNumber)
            displayName: Publish test results

          - task: PublishCodeCoverageResults@2
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: coverage.xml
            displayName: Publish coverage

  - stage: Package
    displayName: Package
    dependsOn: Verify
    condition: succeeded()
    jobs:
      - job: image
        displayName: Build the server image
        timeoutInMinutes: 20
        steps:
          - script: |
              set -euo pipefail
              # Built but not pushed. AIVS is deployed by each hosting ISAC from
              # their own registry; this stage exists to prove the Dockerfile
              # still builds against the committed lockfile, not to publish.
              docker build \
                -f packages/aivs-server/Dockerfile \
                -t "aivs-server:$(Build.BuildNumber)" \
                .
            displayName: docker build

          - script: |
              set -euo pipefail
              # The image must refuse to start without configuration. If this
              # exits 0, the production-posture interlock has regressed.
              if docker run --rm "aivs-server:$(Build.BuildNumber)" \
                   python -m aivs_server.config; then
                echo "ERROR: server accepted an empty configuration" >&2
                exit 1
              fi
              echo "confirmed: refuses to start unconfigured"
            displayName: Image fails closed without configuration

          # -- Software bill of materials --------------------------------
          #
          # Two documents, because they answer different questions and neither
          # subsumes the other:
          #
          #   * the Python SBOM is generated from the committed lockfile and is
          #     byte-reproducible, so two releases can be diffed to see exactly
          #     which dependency moved;
          #   * the image SBOM is scanned from the built container and is the
          #     only one that sees the Debian base layer -- which is most of
          #     what a member firm's vulnerability scanner will actually flag.
          #
          # A hosting ISAC hands these to its own third-party risk function, and
          # to any member firm that assesses the instance before joining.
          - script: |
              set -euo pipefail
              ./scripts/generate-sbom.sh "$(Build.ArtifactStagingDirectory)/sbom"
            displayName: SBOM (Python runtime, from the lockfile)

          - script: |
              set -euo pipefail
              # Pinned: the tool that describes what shipped is itself part of
              # the supply chain, and an unpinned installer would undo the point
              # of the document it produces.
              SYFT_VERSION=1.20.0
              curl -sSfL \
                "https://raw.githubusercontent.com/anchore/syft/v${SYFT_VERSION}/install.sh" \
                | sh -s -- -b "$(Agent.TempDirectory)/bin" "v${SYFT_VERSION}"

              "$(Agent.TempDirectory)/bin/syft" \
                "aivs-server:$(Build.BuildNumber)" \
                -o "cyclonedx-json=$(Build.ArtifactStagingDirectory)/sbom/aivs-server-image-sbom.cdx.json"
            displayName: SBOM (container image, including the OS layer)

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: $(Build.ArtifactStagingDirectory)/sbom
              ArtifactName: sbom
            displayName: Publish SBOMs
