# =============================================================================
# AIVS edge proxy -- mTLS termination and identity injection.
#
# This file is one of the three stacked controls that make it safe for the
# application to derive an organisation's identity from HTTP headers
# (see packages/aivs-server/src/aivs_server/auth/mtls.py):
#
#   1. The app container publishes no host port; only this proxy can reach it.
#   2. THIS FILE unconditionally overwrites every identity header on every
#      request, so a client-supplied value can never survive to the app.
#   3. This proxy presents a shared secret in X-Proxy-Auth, which the app
#      compares in constant time, and the app additionally checks our peer
#      address against an allowlist.
#
# The proxy is deliberately NOT trusted to decide identity. It forwards the
# full client certificate and the application re-parses it, because nginx's
# $ssl_client_fingerprint is SHA-1 and we will not key an authorisation
# decision on a hash with practical collision attacks.
#
# Image: nginxinc/nginx-unprivileged (runs as uid 101, binds high ports only,
# needs no capabilities). Everything below assumes that image's layout.
# =============================================================================

# No `user` directive: the unprivileged image is already running as a non-root
# user, and setting `user` from a non-root master produces a warning and is
# ignored. Privilege separation here comes from the container, not from nginx.

worker_processes  auto;

# The container root filesystem is read-only; every path nginx writes to must
# resolve into one of the tmpfs mounts declared in docker-compose.yml.
pid  /tmp/nginx.pid;

# Log to the container's stderr so the platform's log driver (and from there
# the SIEM) is the single collection point. Nothing security-relevant is
# written to a file inside the container, where it would be lost on restart.
error_log  /dev/stderr  warn;

events {
    worker_connections  2048;
}

http {
    # -------------------------------------------------------------------
    # Injected configuration
    #
    # /etc/nginx/rendered is a tmpfs. At container start the stock nginx
    # entrypoint script (20-envsubst-on-templates.sh) reads every
    # /etc/nginx/templates/*.template, substitutes environment variables into
    # it, and writes the result here. That is how the proxy shared secret
    # reaches nginx without ever being written into a committed file or baked
    # into an image layer: docker-compose passes AIVS_PROXY_SHARED_SECRET into
    # the container environment, the template turns it into the
    # $proxy_shared_secret variable used below, and the rendered copy lives
    # only in RAM.
    #
    # NGINX_ENVSUBST_FILTER is set to ^AIVS_ in docker-compose.yml so that
    # envsubst rewrites only our own variables. Without that filter it would
    # also eat nginx's own $host, $remote_addr, ... inside the template.
    #
    # If the secret is unset, the template renders an empty value, the app
    # rejects every request, and the deployment fails closed rather than open.
    # docker-compose additionally refuses to start with the variable unset.
    # -------------------------------------------------------------------
    include  /etc/nginx/rendered/*.conf;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Do not advertise the nginx version in responses or error pages. Version
    # disclosure turns a future nginx CVE into a targeted, pre-qualified hit.
    server_tokens  off;

    # Scratch paths, all pointed at the /var/cache/nginx tmpfs. Declared
    # explicitly rather than inherited from compile-time defaults so a reviewer
    # can confirm no request body can ever land on a persistent filesystem.
    client_body_temp_path  /var/cache/nginx/client_temp;
    proxy_temp_path        /var/cache/nginx/proxy_temp;
    fastcgi_temp_path      /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path        /var/cache/nginx/uwsgi_temp;
    scgi_temp_path         /var/cache/nginx/scgi_temp;

    # Headers containing underscores are dropped (this is the nginx default,
    # restated because we depend on it): it means a client cannot smuggle
    # `x_proxy_auth` past a downstream component that normalises underscores
    # to dashes.
    underscores_in_headers  off;

    # Reject requests whose method/URI we would otherwise pass through blindly.
    # The app enforces its own routing; this is a cheap outer bound.
    ignore_invalid_headers  on;

    # -------------------------------------------------------------------
    # Access log -- one JSON object per request, for SIEM ingest.
    #
    # `escape=json` is load-bearing: without it a client-controlled field
    # (User-Agent, request URI, certificate subject) containing a quote or
    # backslash would break out of its JSON string and let an attacker forge
    # log records. Do not remove it.
    #
    # ssl_client_fingerprint is logged as SHA-1 and named accordingly. It is
    # useful for correlating a burst of requests to one connection; it is NOT
    # the identity the application authorises against, which is the SHA-256 the
    # app computes from the forwarded certificate.
    # -------------------------------------------------------------------
    # No query string ($args): TAXII filters name what a member was looking
    # for, and this log is forwarded to the ISAC's collector. The app's own
    # access log omits it for the same reason; the two used to disagree.
    log_format  aivs_json  escape=json
        '{'
          '"ts":"$time_iso8601",'
          '"request_id":"$request_id",'
          '"remote_addr":"$remote_addr",'
          '"remote_port":"$remote_port",'
          '"method":"$request_method",'
          '"uri":"$uri",'
          '"protocol":"$server_protocol",'
          '"status":$status,'
          '"bytes_sent":$body_bytes_sent,'
          '"request_length":$request_length,'
          '"request_time":$request_time,'
          '"upstream_addr":"$upstream_addr",'
          '"upstream_status":"$upstream_status",'
          '"upstream_time":"$upstream_response_time",'
          '"tls_version":"$ssl_protocol",'
          '"tls_cipher":"$ssl_cipher",'
          '"client_verify":"$ssl_client_verify",'
          '"client_subject_dn":"$ssl_client_s_dn",'
          '"client_issuer_dn":"$ssl_client_i_dn",'
          '"client_serial":"$ssl_client_serial",'
          '"client_fingerprint_sha1":"$ssl_client_fingerprint",'
          '"user_agent":"$http_user_agent",'
          '"limit_req_status":"$limit_req_status",'
          '"limit_conn_status":"$limit_conn_status"'
        '}';

    access_log  /dev/stdout  aivs_json;

    # -------------------------------------------------------------------
    # Connection handling and timeouts
    #
    # Every timeout is short. A slowloris-style attacker holding thousands of
    # half-open requests costs us worker_connections, and the ISAC membership
    # is small enough that no legitimate client needs a slow one.
    # -------------------------------------------------------------------
    sendfile                    on;
    tcp_nopush                  on;
    keepalive_timeout           30s;
    keepalive_requests          200;
    client_header_timeout       10s;
    client_body_timeout         15s;
    send_timeout                30s;
    reset_timedout_connection   on;

    # Matches Settings.max_body_bytes (5 * 1024 * 1024) exactly. If the two
    # ever diverge, the larger of the pair becomes dead weight: a body the
    # proxy accepts and the app then rejects wastes bandwidth and memory.
    client_max_body_size        5m;
    client_body_buffer_size     128k;

    # Bound the inbound header block. The client certificate does NOT travel in
    # an inbound header (we read it from the TLS layer), so 8k lines are ample
    # and a larger allowance would only buy an attacker cheap memory pressure.
    client_header_buffer_size   4k;
    large_client_header_buffers 4 8k;

    # Request bodies are fully buffered before the app is contacted (nginx
    # default, restated because we rely on it): the app's workers are never
    # occupied by a client dribbling out a 5 MiB STIX bundle.
    proxy_request_buffering     on;

    # Upstream response buffers must accommodate the app's own headers. 16k is
    # generous for JSON APIs and keeps responses off the temp filesystem.
    proxy_buffer_size           16k;
    proxy_buffers               8 16k;
    proxy_busy_buffers_size     32k;

    # -------------------------------------------------------------------
    # Rate limiting
    #
    # Keyed on $ssl_client_fingerprint. SHA-1 is unsuitable for *identity* --
    # an attacker who can produce a colliding certificate could impersonate a
    # member -- but it is entirely adequate for *bucketing*, where the worst a
    # collision does is make two members share a quota. Keying on the source
    # address instead would collapse every member behind one ISAC NAT into a
    # single bucket.
    #
    # Rates are sized for TAXII polling: a member collection poller runs at
    # roughly 1 r/s, so 20 r/s with a burst of 40 leaves two orders of
    # magnitude of headroom before a legitimate client is shaped.
    # -------------------------------------------------------------------
    limit_req_zone   $ssl_client_fingerprint  zone=aivs_req_per_client:10m  rate=20r/s;
    limit_conn_zone  $ssl_client_fingerprint  zone=aivs_conn_per_client:10m;
    # Second connection zone keyed on the source address, to bound a single
    # host that opens many connections under many different certificates.
    limit_conn_zone  $binary_remote_addr      zone=aivs_conn_per_addr:10m;

    # 429 rather than the nginx default of 503: a throttled member should see
    # "slow down", not "the service is broken", and monitoring should not page.
    limit_req_status   429;
    limit_conn_status  429;
    limit_req_log_level  warn;
    limit_conn_log_level warn;

    # -------------------------------------------------------------------
    # TLS
    # -------------------------------------------------------------------
    # TLS 1.2 is retained only because some member security appliances still
    # cannot do 1.3. TLS 1.0/1.1 are absent and must stay absent.
    ssl_protocols              TLSv1.2 TLSv1.3;

    # AEAD-only, forward-secret suites for TLS 1.2. No CBC (Lucky13, padding
    # oracles), no static RSA key exchange, no SHA-1. TLS 1.3 negotiates its
    # own suites and ignores this list.
    ssl_ciphers                ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;

    # Off, as required for TLS 1.3 (where server preference is meaningless) and
    # preferable for 1.2 as well: the client is better placed to know whether
    # it has AES hardware acceleration or should choose ChaCha20.
    ssl_prefer_server_ciphers  off;

    # Hybrid post-quantum key exchange first (X25519 + ML-KEM-768, FIPS 203),
    # classical curves after it for clients that cannot do it yet. The threat
    # is harvest-now-decrypt-later: TLS recorded today carrying embargoed
    # findings is readable once a quantum computer exists, and that content
    # stays valuable for years. Needs OpenSSL >= 3.5 in the proxy image, and
    # TLS 1.3 on the client -- a TLS 1.2 client gets a classical curve, which
    # is why 1.2 should go as soon as members' appliances allow.
    # tests/unit/test_proxy_config.py pins the order.
    ssl_ecdh_curve             X25519MLKEM768:X25519:secp384r1:prime256v1;

    ssl_session_cache          shared:AIVS_TLS:10m;
    ssl_session_timeout        1h;

    # Session tickets off. Tickets are encrypted under a key that nginx
    # generates at start and never rotates within a process lifetime; an
    # attacker who obtains it can decrypt every resumed session retroactively,
    # which defeats the forward secrecy the ECDHE suites above buy us. The
    # server-side session cache gives us resumption without that exposure.
    ssl_session_tickets        off;

    # OCSP stapling is deliberately not enabled: the AIVS CA is private and
    # runs no OCSP responder (see deploy/ca/). Enabling stapling would only
    # produce start-up warnings and a per-request DNS lookup that fails.
    # Revocation is handled by the application against its own database, which
    # is authoritative -- see deploy/ca/revoke.sh.

    # -------------------------------------------------------------------
    # Upstream
    #
    # Plaintext HTTP over the compose-internal `backend` network. That is
    # acceptable here only because proxy and app share a host and a private
    # bridge, and because the shared secret means merely reaching the app is
    # not enough to forge an identity. A multi-host deployment MUST carry this
    # hop over the WireGuard overlay or add proxy_ssl_* mutual TLS.
    #
    # Docker's embedded DNS resolves `app` once, at configuration load. That is
    # fine for compose (the app keeps a stable address for the life of the
    # stack) but means `docker compose up -d --force-recreate app` should be
    # followed by a proxy reload. On an orchestrator with churning IPs, replace
    # this block with a `resolver` directive and a variable proxy_pass target.
    # -------------------------------------------------------------------
    upstream aivs_app {
        server app:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
        keepalive_timeout 60s;
    }

    # -------------------------------------------------------------------
    # Public listener: mutual TLS required.
    # -------------------------------------------------------------------
    server {
        # Port 8443 inside the container, published to the host as 443. A high
        # port is what lets the whole container run as uid 101 with
        # cap_drop: [ALL] -- no CAP_NET_BIND_SERVICE is needed.
        #
        # IPv4 only, deliberately. Docker bridge networks are IPv4 unless IPv6
        # is explicitly enabled on the daemon, and `listen [::]:8443` on a host
        # whose kernel has IPv6 disabled makes nginx fail to start with an
        # address-family error. If your deployment publishes over IPv6, add
        # `listen [::]:8443 ssl;` here after confirming the daemon and the
        # network are configured for it.
        listen       8443 ssl;
        http2        on;
        server_name  _;

        # Network-layer allowlist, evaluated before TLS-terminated identity.
        # Sourced from a mounted file so an operator can change membership
        # without editing this config. See deploy/nginx/allowlist.conf.example
        # for the WireGuard-overlay alternative. The file is mounted
        # unconditionally by docker-compose.yml, so a missing allowlist is a
        # start-up failure rather than a silently absent control.
        include  /etc/nginx/allowlist.conf;

        ssl_certificate      /etc/nginx/ca/nginx/server.crt;
        ssl_certificate_key  /etc/nginx/ca/nginx/server.key;

        # The member trust anchor: root + issuing intermediate, concatenated.
        # nginx also sends the subject DNs from this file to clients as
        # certificate-authority hints, which is why it holds only the AIVS CA
        # and never a public bundle.
        ssl_client_certificate  /etc/nginx/ca/ca-chain.pem;

        # `on`, never `optional`. With `optional`, a certificate-less request
        # reaches the app carrying X-Client-Verify: NONE, and the app's rejection
        # becomes the only thing standing between an anonymous caller and the
        # TAXII surface. We want the handshake itself to be the gate.
        ssl_verify_client  on;

        # leaf -> intermediate -> root is a depth of 2. Anything deeper implies
        # a sub-CA we did not issue, which we do not accept.
        ssl_verify_depth  2;

        # CRL checking is available but off by default, for two reasons a
        # reviewer should weigh rather than assume:
        #   * OpenSSL applies X509_V_FLAG_CRL_CHECK_ALL when ssl_crl is set,
        #     so the file must contain a current CRL for EVERY CA in the chain
        #     (root and intermediate). deploy/ca/revoke.sh produces exactly
        #     that as out/crl/crl-chain.pem.
        #   * A CRL that passes its nextUpdate makes nginx reject *all*
        #     handshakes. That converts a missed cron job into a total outage.
        # AIVS treats its own database as authoritative for revocation: a
        # revoked certificate's organisation is disabled there and every
        # request is refused regardless of what the CRL says. Operators who
        # want the belt-and-braces control should enable the line below AND
        # schedule CRL regeneration well inside default_crl_days.
        # ssl_crl  /etc/nginx/ca/crl/crl-chain.pem;

        # ---------------------------------------------------------------
        # Response headers set by the proxy.
        #
        # NGINX INHERITANCE TRAP, read before editing: add_header directives
        # are inherited from an outer level ONLY IF the inner level declares no
        # add_header of its own. A single add_header inside a location silently
        # discards every add_header from the server block. That is why the
        # common set lives in a snippet which each location that adds a header
        # of its own must re-include, rather than being written once here.
        # ---------------------------------------------------------------
        include  /etc/nginx/snippets/aivs-security-headers.conf;

        # Strip anything the app or a future middleware leaks about the stack
        # it runs on. proxy_hide_header suppresses the UPSTREAM's headers;
        # nginx's own `Server: nginx` remains, and `server_tokens off` above has
        # already removed the version from it. Removing the header entirely
        # needs the third-party headers-more module, which would mean building
        # a custom nginx image -- more supply chain for a value that no longer
        # tells an attacker anything actionable.
        proxy_hide_header  X-Powered-By;
        proxy_hide_header  Server;

        # ---------------------------------------------------------------
        # Client-certificate handshake failures.
        #
        # With ssl_verify_client on, nginx completes the TLS handshake and then
        # answers with internal status 495 (bad certificate), 496 (no
        # certificate) or 497 (plain HTTP sent to the TLS port). Mapping them
        # to one indistinguishable JSON 403 avoids telling an unauthenticated
        # caller which of the three it tripped.
        # ---------------------------------------------------------------
        error_page  495 496 497  = @client_cert_error;

        # A named location; it can only be reached through error_page, never by
        # a request URI.
        location @client_cert_error {
            default_type  application/json;
            return  403  '{"title":"forbidden","description":"a valid AIVS member client certificate is required"}';
        }

        # ---------------------------------------------------------------
        # Rate and connection limits, declared once at server level and
        # inherited by every location below. Declaring them here rather than
        # per-location means a location added later cannot accidentally opt
        # out of them by forgetting a line.
        # ---------------------------------------------------------------
        limit_req   zone=aivs_req_per_client burst=40 nodelay;
        limit_conn  aivs_conn_per_client 24;
        limit_conn  aivs_conn_per_addr   64;

        # ---------------------------------------------------------------
        # The portal and anything not matched by a more specific location.
        #
        # snippets/aivs-identity-headers.conf is the single place the identity
        # headers are set; see that file for the reasoning. It is included by
        # every proxying location, and every proxying location includes it.
        # ---------------------------------------------------------------
        # Health and readiness probes belong to the orchestrator: /healthz on
        # the internal listener below, /readyz and /metrics on the app itself
        # over the backend network. There is no reason to expose them on the
        # public, member-facing listener: liveness tells a member nothing, and
        # readiness would hand them a database-reachability oracle. Return 404 so
        # the public surface does not answer them at all. Defence in depth -- the
        # application also treats these as harmless -- but the least-exposure
        # default is to not answer a probe to whoever is not the orchestrator.
        location = /healthz { return 404; }
        location = /readyz  { return 404; }
        # Component health and backlogs: for the ISAC's own monitoring, scraped
        # from the app on the backend network, never served to members.
        location = /metrics { return 404; }

        location / {
            include     /etc/nginx/snippets/aivs-identity-headers.conf;
            proxy_pass  http://aivs_app;
        }

        # ---------------------------------------------------------------
        # JSON API surfaces. Identical proxying to `location /`, plus a
        # document-free CSP: these endpoints never return HTML, so a policy
        # that forbids loading anything at all costs nothing and neutralises
        # any content-sniffing or reflected-content trick against a browser
        # that is pointed at them directly. (The portal cannot take this
        # policy, which is why it is applied per-location and not globally.)
        # ---------------------------------------------------------------
        location /taxii2/ {
            include     /etc/nginx/snippets/aivs-identity-headers.conf;
            # Re-included because the add_header below would otherwise drop the
            # server-level set entirely -- see the inheritance trap note above.
            include     /etc/nginx/snippets/aivs-security-headers.conf;
            add_header  Content-Security-Policy  "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; sandbox"  always;
            proxy_pass  http://aivs_app;
        }

        location /api/ {
            include     /etc/nginx/snippets/aivs-identity-headers.conf;
            include     /etc/nginx/snippets/aivs-security-headers.conf;
            add_header  Content-Security-Policy  "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; sandbox"  always;
            proxy_pass  http://aivs_app;
        }

        # Hidden files, VCS metadata and editor backups: nothing under a URL
        # like this is ever legitimate, and matching it here keeps such probes
        # out of the application's logs and rate-limit buckets.
        location ~ /\. {
            deny  all;
            access_log  off;
        }
    }

    # -------------------------------------------------------------------
    # Internal listener: container healthcheck only.
    #
    # No TLS and no client certificate, because the healthcheck process runs
    # inside this container and has neither. Three things keep that from being
    # an unauthenticated hole:
    #   * port 8080 is not published to the host by docker-compose.yml;
    #   * nginx listens on every interface, so `frontend` can open the port;
    #     the allow/deny rules below are what admit only loopback and the
    #     backend subnet, so a compromised sibling on `frontend` is refused.
    #
    # It answers from nginx itself rather than proxying to the app. Proxying
    # would make a slow database roll the proxy's health state, and Docker
    # would then restart a perfectly healthy proxy during a database blip. The
    # app's own liveness is covered by its own healthcheck.
    # -------------------------------------------------------------------
    server {
        listen       8080;
        server_name  _;

        # Health polling every 10s would otherwise dominate the SIEM feed and
        # bury real access records.
        access_log  off;

        allow  127.0.0.1/32;
        allow  ::1/128;
        allow  172.29.10.0/24;   # the compose `backend` network
        deny   all;

        location = /healthz {
            default_type  application/json;
            return  200  '{"status":"ok"}';
        }

        location / {
            return  404;
        }
    }
}
