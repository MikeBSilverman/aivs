# =============================================================================
# The single place AIVS identity headers are set.
#
# Included by every location in deploy/nginx/nginx.conf that proxies to the
# application. Nothing may proxy to the application without including it: this
# file is control #2 of the three that make header-derived identity safe.
#
# Every header below is set with proxy_set_header, which REPLACES any
# same-named header the client sent. There is no ordering, no conditional and
# no "if the client did not already provide one" -- a client-supplied
# X-Client-Cert or X-Proxy-Auth cannot reach the application by any path.
#
# The empty-valued entries at the bottom are headers nginx does not itself set.
# Assigning "" removes them from the upstream request entirely. They are
# enumerated by name rather than cleared wholesale with
# `proxy_pass_request_headers off`, because that would also drop Accept,
# Content-Type, Range and the analyst portal's session cookie.
# =============================================================================

proxy_http_version  1.1;
# Required for upstream keepalive: without it nginx forwards the client's
# Connection header and the pooled upstream connection is torn down each time.
proxy_set_header  Connection  "";

# -- Identity, derived from the TLS layer, never from the client --------------

# Literal "SUCCESS" when the chain validated. The application requires exactly
# that value and rejects NONE / FAILED:<reason>.
proxy_set_header  X-Client-Verify  $ssl_client_verify;

# The full leaf certificate as URL-escaped PEM. The application unescapes it,
# re-parses the ASN.1, computes the SHA-256 fingerprint itself and re-checks
# the validity window. We forward the certificate rather than nginx's summary
# of it for two reasons: $ssl_client_fingerprint is SHA-1, and forwarding the
# raw material keeps this proxy out of the set of components that must be
# correct for an authorisation decision to be sound.
proxy_set_header  X-Client-Cert    $ssl_client_escaped_cert;

# Proves to the application that this request came from the proxy and not from
# something else that reached the internal network. $proxy_shared_secret is
# rendered from AIVS_PROXY_SHARED_SECRET at container start; see the
# `include /etc/nginx/rendered/*.conf` comment in nginx.conf. The application
# compares it in constant time.
proxy_set_header  X-Proxy-Auth     $proxy_shared_secret;

# Always nginx's own per-request id, never the client's. Accepting a
# caller-chosen correlation id lets a member forge audit-trail entries or
# deliberately collide with another member's requests.
proxy_set_header  X-Request-Id     $request_id;

# -- Forwarding metadata: replaced, not appended ------------------------------

# $proxy_add_x_forwarded_for would APPEND to whatever chain the client sent,
# letting a caller prepend arbitrary "original" addresses. We are the edge, so
# the only address that is a fact is the peer we are talking to.
proxy_set_header  X-Forwarded-For    $remote_addr;
proxy_set_header  X-Real-IP          $remote_addr;
proxy_set_header  X-Forwarded-Proto  https;
proxy_set_header  X-Forwarded-Port   443;
proxy_set_header  X-Forwarded-Host   $host;
proxy_set_header  Host               $host;

# -- Inbound spoofing attempts nginx does not otherwise overwrite -------------
#
# Alternative spellings used by other reverse proxies (Apache mod_ssl, HAProxy,
# Envoy, ingress-nginx). None is read by AIVS today. They are cleared so that
# if a future middleware, WAF or sidecar ever learns to read one, it cannot be
# handed a client-supplied value.
proxy_set_header  X-Client-Fingerprint    "";
proxy_set_header  X-Client-Subject        "";
proxy_set_header  X-Client-Issuer         "";
proxy_set_header  X-Client-Serial         "";
proxy_set_header  X-Client-Dn             "";
proxy_set_header  X-SSL-Client-Cert       "";
proxy_set_header  X-SSL-Client-Verify     "";
proxy_set_header  X-SSL-Client-S-DN       "";
proxy_set_header  X-SSL-Client-I-DN       "";
proxy_set_header  X-SSL-Client-Serial     "";
proxy_set_header  SSL-Client-Cert         "";
proxy_set_header  SSL-Client-Verify       "";
proxy_set_header  X-Forwarded-Client-Cert "";
proxy_set_header  X-Org-Id                "";
proxy_set_header  X-Org-Slug              "";
proxy_set_header  X-Aivs-Org              "";
proxy_set_header  X-Aivs-Role             "";

# Classic reverse-proxy path-override headers. Several frameworks honour them
# for routing, which is a standard way to reach an endpoint the proxy believed
# it had blocked, and X-HTTP-Method-Override turns a permitted GET into a PUT.
proxy_set_header  X-Original-URL          "";
proxy_set_header  X-Rewrite-URL           "";
proxy_set_header  X-Original-Method       "";
proxy_set_header  X-HTTP-Method-Override  "";
proxy_set_header  X-Method-Override       "";

# -- Upstream timeouts --------------------------------------------------------

proxy_connect_timeout  5s;
proxy_send_timeout     30s;
# Long enough for a large TAXII page assembled under the app's 15s statement
# timeout, short enough that a wedged worker is reaped rather than accumulated.
proxy_read_timeout     60s;

# `non_idempotent` is deliberately ABSENT from this list. Without it nginx will
# not re-send a POST/PATCH/LOCK that has already been passed upstream, which is
# what stops a read timeout from silently duplicating an advisory submission or
# an embargo change. Retrying idempotent methods is still wanted: it is what
# absorbs a stale pooled keepalive connection.
proxy_next_upstream        error timeout;
proxy_next_upstream_tries  2;
