# =============================================================================
# Response security headers common to every AIVS response.
#
# This is a snippet rather than a block in the server{} context because of the
# nginx add_header inheritance rule: a level that declares ANY add_header of
# its own inherits NONE from its parent. Any location that adds a header (for
# example the JSON surfaces adding a Content-Security-Policy) must therefore
# re-include this file, and keeping the set in one place is what stops those
# copies from drifting apart.
#
# `always` on every line so the headers are present on 4xx/5xx responses too.
# An error page is precisely where a missing X-Content-Type-Options gets used.
# =============================================================================

# Two years, subdomains included. AIVS is reachable over TLS only; there is no
# plaintext listener to downgrade to, so there is no transition period to
# protect. `preload` is intentionally omitted: submission to the browser
# preload list is irreversible on a useful timescale and an ISAC's own domain
# policy is not ours to make.
add_header  Strict-Transport-Security  "max-age=63072000; includeSubDomains"  always;

# The application declares an explicit Content-Type on every response; sniffing
# can only ever turn a correct one into a wrong one.
add_header  X-Content-Type-Options  "nosniff"  always;

# The analyst portal has no legitimate reason to be framed, and clickjacking a
# portal that can release an embargo is a real risk. Modern browsers take this
# from the app's frame-ancestors CSP directive; X-Frame-Options covers the
# older ones still deployed in bank estates.
add_header  X-Frame-Options  "DENY"  always;

# Pre-CVE advisory identifiers must not leak to third parties through a
# Referer header if an analyst follows an external link out of the portal.
add_header  Referrer-Policy  "no-referrer"  always;

# Severs the window.opener relationship and forbids cross-origin embedding of
# AIVS responses, so a hostile page cannot read them or drive the portal.
add_header  Cross-Origin-Opener-Policy    "same-origin"  always;
add_header  Cross-Origin-Resource-Policy  "same-origin"  always;

# AIVS uses none of these capabilities. Denying them outright means a future
# XSS in the portal cannot reach a microphone or a payment handler.
add_header  Permissions-Policy  "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=()"  always;
