# Alembic configuration.
#
# The database URL is deliberately NOT set here. env.py reads it from
# AIVS_DATABASE_URL via the application settings, so a credential never sits in
# a checked-in file and migrations cannot be pointed at the wrong instance by a
# stale config.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/src
path_separator = os
# Timestamped, ordered, and readable in a directory listing.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
