# The one change the end-to-end stack makes to docker-compose.yml: the host
# port. The production file publishes 443 and lets the operator choose only the
# address, and 443 is not free on every machine that runs these tests (under
# WSL2 the Windows side may hold it). Nothing a test asserts depends on the
# number. `!override` replaces the list; without it compose would append this
# mapping to the production one (CLAUDE.md section 5).
services:
  proxy:
    ports: !override
      - "127.0.0.1:${AIVS_E2E_PORT:?set AIVS_E2E_PORT}:8443"

# WORKAROUND FOR A DEFECT IN docker-compose.yml -- delete when it is fixed there.
# The proxy has the static address 172.29.10.2 on `backend`, but nothing reserves
# it: the app joins `backend` first (the proxy waits for it to be healthy) and
# Docker hands it the first free address, which is .2. The proxy then fails to
# start with "Address already in use", so the documented first run (deploy/
# README.md section 3, step 8) cannot complete on a clean host. Giving dynamic
# allocation its own range keeps .2 for the proxy.
networks:
  backend:
    ipam:
      config: !override
        - subnet: 172.29.10.0/24
          ip_range: 172.29.10.128/25
