# AIVS monorepo workspace root.
#
# This file is NOT a distributable package -- it exists to (a) declare the uv
# workspace and (b) hold the single source of truth for lint/type/test config
# shared by every package. Exact dependency versions live in uv.lock, which is
# committed; constraints here stay deliberately loose so the lockfile is the
# only thing a reviewer needs to audit for supply-chain changes.

[project]
name = "aivs-workspace"
version = "0.1.0"
description = "AIVS -- pre-CVE AI vulnerability sharing system (workspace root)"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/aivs-schemas",
    "packages/aivs-server",
    "packages/aivs-client",
]

[tool.uv.sources]
aivs-schemas = { workspace = true }
aivs-server = { workspace = true }
aivs-client = { workspace = true }

[dependency-groups]
dev = [
    "aivs-schemas",
    "aivs-server",
    "aivs-client",
    # Test
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-randomly>=3.16",     # shuffles test order: catches inter-test state leaks
    "hypothesis>=6.120",         # property-based tests for parsers/validators
    "httpx>=0.28",
    "freezegun>=1.5",            # deterministic embargo/expiry tests
    "pyyaml>=6.0",               # reads the compose files in deployment tests
    # Lint / type / security
    "ruff>=0.8",
    "mypy>=1.13",
    "bandit>=1.8",
    "pip-audit>=2.7",
    "types-python-dateutil",
    "types-jsonschema",
    # Supply chain. A CycloneDX SBOM is what a member firm's third-party risk
    # review asks for first, and generating it from the locked runtime
    # environment is the only version of it that matches what actually ships.
    "cyclonedx-bom>=7.3",
]

# ---------------------------------------------------------------------------
# Ruff -- linting + formatting. Security rules (S) are on by default for all
# non-test code; see per-file-ignores for the narrow test exemptions.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = [
    "packages/aivs-schemas/src",
    "packages/aivs-server/src",
    "packages/aivs-client/src",
]
extend-exclude = ["packages/aivs-server/alembic/versions"]

[tool.ruff.lint]
# Preview for exactly one rule, PLR1702 (nesting depth), which ruff has not yet
# stabilised. explicit-preview-rules keeps preview from switching on anything
# a broader selector such as "PL" would otherwise pull in.
preview = true
explicit-preview-rules = true
select = [
    "F",      # pyflakes
    "E", "W", # pycodestyle
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "ANN",    # flake8-annotations (every function typed)
    "ASYNC",  # flake8-async (blocking calls in async code)
    "S",      # flake8-bandit (security)
    "BLE",    # blind except
    "B",      # bugbear
    "A",      # builtin shadowing
    "C4",     # comprehensions
    "DTZ",    # flake8-datetimez -- naive datetimes are embargo bugs
    "T10",    # no leftover pdb
    "T20",    # no print() in library code
    "EM",     # exception messages (no f-string-in-raise noise)
    "G",      # logging-format (no f-strings in log calls)
    "LOG",    # logging correctness
    "PIE",
    "PT",     # pytest style
    "Q",
    "RSE",
    "RET",
    "SLF",    # private member access
    "SIM",
    "TID",    # tidy imports (no relative-parent imports)
    "ARG",    # unused arguments
    "PTH",    # use pathlib
    "ERA",    # commented-out code
    "PL",     # pylint subset
    "PLR1702", # nesting depth, preview: three levels is the ceiling (CLAUDE.md section 8)
    "C90",    # McCabe complexity, max 10 (CLAUDE.md section 8)
    "TRY",    # tryceratops (exception antipatterns)
    "FLY",
    "PERF",
    "RUF",
]
ignore = [
    "ANN401",  # allow typing.Any where genuinely needed (documented at use site)
    "PLR0913", # argument count -- FastAPI dependency injection legitimately exceeds it
    "PLR0917", # positional-argument count -- same reason as PLR0913
    "TRY003",  # long messages in raise; our EM rules already cover the real issue
    "SIM108",  # ternary-vs-if is a readability judgement call
]

[tool.ruff.lint.pylint]
# Type-dispatch and state-machine functions legitimately return from more than
# six branches; forcing them through a single exit point would obscure them.
max-returns = 8
max-nested-blocks = 3

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# EM101 exists to keep long messages out of `raise`. CertificateRejectedError
# and SessionRejectedError take a short stable *reason token* rather than a
# message -- those tokens are the audit vocabulary and belong at the raise site
# where they are read, not bound to a variable one line earlier.
"**/auth/mtls.py" = ["EM101"]
"**/auth/sessions.py" = ["EM101"]
# WebhookRejectedError likewise carries a reason token, not a message.
"**/notify/webhooks.py" = ["EM101", "EM102"]
# Tests: assert is the point; hardcoded test credentials are not secrets;
# private-member access is sometimes needed to assert on internals.
"**/tests/**" = [
    "S101", "S105", "S106", "S107",  # asserts and fake credentials are the point
    "SLF001",                        # asserting on internals is legitimate in tests
    "ANN001", "ANN201", "ANN202",    # fixture factories are inferred, not annotated
    "PLR2004", "ARG001",
]
"**/conftest.py" = ["ANN201", "ANN001", "ARG001"]
# Alembic scaffolding is generated and follows its own conventions.
"**/alembic/env.py" = ["ANN", "ERA"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.isort]
known-first-party = ["aivs_schemas", "aivs_server", "aivs_client"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------------------
# mypy -- strict. Untyped code is a review blind spot; we do not ship it.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_unimported = true
enable_error_code = [
    "redundant-expr",
    "possibly-undefined",
    "truthy-bool",
    "ignore-without-code",
    "unused-awaitable",
]
plugins = ["pydantic.mypy"]
# Each package has its own src root on mypy_path, so a file must be resolved
# relative to that root rather than to the directory it is invoked from --
# otherwise mypy sees aivs_server/auth/deps.py under two module names.
explicit_package_bases = true
namespace_packages = true
mypy_path = [
    "packages/aivs-schemas/src",
    "packages/aivs-server/src",
    "packages/aivs-client/src",
]
exclude = ["packages/aivs-server/alembic/versions/"]

[[tool.mypy.overrides]]
# stix2 ships no type stubs; we isolate that untyped surface behind our own
# typed wrappers in aivs_schemas.extension.builders.
module = ["stix2.*", "stix2patterns.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*", "*.tests.*"]
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["packages/aivs-server/tests", "packages/aivs-schemas/tests", "packages/aivs-client/tests"]
asyncio_mode = "auto"
# Session scope, because the engine and schema fixtures are session-scoped and
# must share one loop with the tests that use them.
asyncio_default_fixture_loop_scope = "session"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--import-mode=importlib",
]
markers = [
    "db: test requires a live PostgreSQL database",
    "e2e: runs against the real stack through nginx (scripts/e2e.sh up); skipped, with the reason, when no stack is up",
    "slow: migrates a scratch database or similar; deselect with '-m \"not slow\"'",
    "authz: authorization matrix test -- the deny-by-default proof",
    "conformance: TAXII 2.1 / STIX 2.1 specification conformance test",
    "abuse: an adversary's sequence of requests, asserting the step at which it is noticed or refused",
    "requirement(id): pins a row of docs/security-requirements.md or docs/non-functional-requirements.md; checked both ways by tests/test_requirements_pinned.py",
]
filterwarnings = [
    "error",                     # warnings are failures; we do not accumulate debt
    "ignore::DeprecationWarning:stix2.*",
]

[tool.coverage.run]
branch = true
# SQLAlchemy's asyncio layer runs on greenlet. Without this, coverage.py loses
# the trace function across greenlet switches and reports only the statements
# that *contain* an await -- everything between them shows as missing. The
# effect is not noise: it understated the total by 8 points and claimed the
# distribution row-writing loop never executed, in a run whose test reads those
# rows back over TAXII. It also put CI below its own fail_under gate for a
# reason no one would guess from the report.
concurrency = ["greenlet", "thread"]
source = ["aivs_schemas", "aivs_server", "aivs_client"]
omit = ["*/alembic/*", "*/tests/*"]

[tool.coverage.report]
skip_covered = false
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "if __name__ == .__main__.:",
]
# The floor for the codebase as a whole. The security-critical modules --
# identity, authorization, sealing, publication, distribution, embargo, the TAXII
# visibility query -- are held to 93 by a second `coverage report` over the same
# data (see CLAUDE.md section 2 and the pipeline). This comment used to claim
# that second check while nothing ran it.
fail_under = 85

[tool.bandit]
exclude_dirs = ["packages/aivs-server/tests", "packages/aivs-schemas/tests", "packages/aivs-client/tests"]
